name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://bondrota-api.onrender.com/api/v1

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # A suite mockada intercepta a API no browser: nao precisa de backend
      # nem de credenciais, entao roda em todo PR.
      - name: Run end-to-end tests
        run: npm run test:e2e

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    name: Deploy to Vercel
    # O gate: nada e publicado antes de lint, typecheck, build e e2e passarem.
    needs: [quality, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      # Push no main publica em producao; PR gera um preview isolado.
      TARGET_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # A Vercel responde "Could not retrieve Project Settings" tanto para secret
      # ausente quanto para token sem acesso ao time. Checar antes separa os dois.
      - name: Check required secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          missing=""
          [ -n "$VERCEL_TOKEN" ] || missing="$missing VERCEL_TOKEN"
          [ -n "$VERCEL_ORG_ID" ] || missing="$missing VERCEL_ORG_ID"
          [ -n "$VERCEL_PROJECT_ID" ] || missing="$missing VERCEL_PROJECT_ID"
          if [ -n "$missing" ]; then
            echo "::error::Secrets ausentes ou vazios:$missing"
            echo "Configure em Settings > Secrets and variables > Actions > Repository secrets."
            exit 1
          fi
          echo "Os tres secrets estao presentes."
          echo "ORG_ID começa com: $(printf '%.5s' "$VERCEL_ORG_ID")..."

      # Fala direto com a API da Vercel para separar "token sem acesso" (403) de
      # "IDs errados" (404) do erro generico que o `vercel pull` reporta. So o
      # status HTTP e impresso; o GitHub ja mascara o secret em qualquer log.
      - name: Diagnose Vercel API access
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          status=$(curl -s -o /tmp/vercel-diag.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "HTTP status: $status"
          case "$status" in
            200) echo "Token tem acesso ao projeto. O problema esta em outro lugar." ;;
            401) echo "::error::Token invalido ou expirado." ;;
            403) echo "::error::Token valido mas sem acesso a este time/projeto. Verifique o Scope escolhido ao criar o token." ;;
            404) echo "::error::VERCEL_PROJECT_ID ou VERCEL_ORG_ID nao correspondem a um projeto existente para este token." ;;
            *) echo "::warning::Status inesperado, veja o corpo da resposta abaixo." ;;
          esac
          cat /tmp/vercel-diag.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=$TARGET_ENV --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: vercel build ${{ env.TARGET_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ env.TARGET_ENV == 'production' && '--prod' || '' }} --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Publish deploy URL
        run: |
          {
            echo "### Deploy ($TARGET_ENV)"
            echo ""
            echo "${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
